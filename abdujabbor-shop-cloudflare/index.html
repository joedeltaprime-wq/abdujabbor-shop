              <input

              <button type="submit">
                ${svg('search',20)}

              </nav>

              <label class="premium-language">
                <span>
                  ${
                    currentLang==='ru'
                      ? '🇷🇺'

                        ? '🇬🇧'
                        : '🇺🇿'
                  }
                </span>

                <select data-premium-language aria-label="Language">
                  <option value="uz" ${currentLang==='uz'?'selected':''}>O‘zbekcha</option>
                  <option value="ru" ${currentLang==='ru'?'selected':''}>Русский</option>
                  <option value="en" ${currentLang==='en'?'selected':''}>English</option>
                </select>

        <div class="premium-catbar">

            <button

                currentCategory==='all' ? 'active' : ''

      shell.querySelector('[data-premium-home]')

      shell.querySelector('[data-premium-search]')

          if(!oldSearch || !oldSearchInput){
            return;
          }

          oldSearchInput.value =
            shell.querySelector('[data-premium-search] input').value;

          oldSearch.dispatchEvent(
            new Event('submit',{
              bubbles:true,
              cancelable:true
            })
          );
        });

      shell.querySelector('[data-premium-theme]')
        ?.addEventListener('click',()=>{
          oldTheme?.click();
        });

      shell.querySelector('[data-premium-language]')
        ?.addEventListener('change',e=>{
          if(!oldLang){

          oldLang.value = e.target.value;

          oldLang.dispatchEvent(
            new Event('change',{
              bubbles:true
            })

          ? 'О нас'
          : currentLang==='en'
            ? 'About us'
            : 'Biz haqimizda'
      );

      const productCount =
        app.querySelectorAll('.product-grid .product-card').length;

      const section = document.createElement('section');
      section.className = 'premium-hero';

      section.innerHTML = `

            <span>Abdujabbor Shop</span>

              </span>

            <div>
              <span class="premium-benefit-icon">${svg('truck',22)}</span>

                <small>${T.deliveryNote}</small>
              </span>
            </div>

            <div>
              <span class="premium-benefit-icon">${svg('headset',22)}</span>

                <b>${T.support}</b>
                <small>${T.supportNote}</small>
              </span>
            </div>

        </div>

        <div class="premium-hero-visual">

          <img

          <div class="premium-hero-shade"></div>

          <div class="premium-dots">

            <i></i>

            <span>“${T.quote}”</span>

      `;

      section.querySelector('[data-premium-catalog]')

      section.querySelector('[data-premium-about-hero]')
        ?.addEventListener('click',()=>{

      return {

        oldService
      };
    }

    function enhance(){
      /*
       * IMPORTANT:
       * /admin is left untouched.
       * Existing app.js continues to control the admin panel.
       */
      if(location.pathname==='/admin'){
        return;
      }

      if(app.querySelector('.premium-shell')){
        return;
      }

      const header = createHeader();

      if(!header){
        return;
      }

      header.oldTopbar.before(header.shell);

      header.oldTopbar.classList.add('premium-legacy');
      header.oldHeader.classList.add('premium-legacy');
      header.oldCategories.classList.add('premium-legacy');

      const hero = createHero();

      if(hero){
        hero.oldHero.before(hero.section);

        hero.oldHero.classList.add('premium-legacy');
        hero.oldService?.classList.add('premium-legacy');
      }
    }

    let scheduled = false;

    function scheduleEnhance(){
      if(scheduled){
        return;
      }

      scheduled = true;

      requestAnimationFrame(()=>{
        scheduled = false;
        enhance();
      });
    }

    const observer = new MutationObserver(scheduleEnhance);

    observer.observe(app,{
      childList:true,
      subtree:true
    });

    window.addEventListener('popstate',scheduleEnhance);
    window.addEventListener('hashchange',scheduleEnhance);

    scheduleEnhance();
  </script>

</body>
</html>
