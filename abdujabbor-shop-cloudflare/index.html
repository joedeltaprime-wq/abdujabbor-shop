<!doctype html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#061426" />

  <title>
    Abdujabbor Shop — Uyingiz uchun keraklisi
  </title>

  <meta
    name="description"
    content="Abdujabbor Shop — maishiy texnika va uy-ro‘zg‘or buyumlari do‘koni."
  />

  <link
    rel="icon"
    href="/assets/logo.png"
  />

  <link
    rel="apple-touch-icon"
    href="/assets/logo.png"
  />

  <!-- EXISTING WEBSITE CSS -->
  <link
    rel="stylesheet"
    href="/styles.css"
  />


  <!-- ======================================================
       PREMIUM DESIGN V2
  ======================================================= -->

  <style>

    /* ======================================================
       GLOBAL
    ======================================================= */

    :root{
      --premium-bg:#061426;
      --premium-bg-2:#071a2e;
      --premium-bg-3:#0a223d;

      --premium-blue:#168cff;
      --premium-blue-2:#0875f5;
      --premium-blue-soft:#42a5ff;

      --premium-gold:#f2c452;

      --premium-text:#ffffff;
      --premium-muted:#91a9c4;

      --premium-line:#1d527f;

      --premium-shadow:
        0 20px 55px
        rgba(0,0,0,.25);
    }


    body{
      overflow-x:hidden;
    }


    .premium-v2-legacy{
      display:none !important;
    }


    .premium-v2-shell,
    .premium-v2-hero{
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    .premium-v2-shell *,
    .premium-v2-hero *{
      box-sizing:border-box;
    }


    .premium-v2-shell button,
    .premium-v2-hero button{
      font:inherit;
    }


    /* ======================================================
       TOP INFO BAR
    ======================================================= */

    .premium-v2-topbar{
      min-height:76px;

      display:flex;
      align-items:center;

      background:
        linear-gradient(
          90deg,
          #07182b 0%,
          #082541 50%,
          #07182b 100%
        );

      border-bottom:
        1px solid
        rgba(76,145,210,.22);
    }


    .premium-v2-topgrid{
      display:grid;

      grid-template-columns:
        1fr
        1fr
        1fr;

      align-items:center;
    }


    .premium-v2-feature{
      min-height:48px;

      display:flex;
      align-items:center;

      gap:17px;

      padding:
        0 40px;

      color:#fff;

      border-right:
        1px solid
        rgba(85,153,218,.29);

      text-decoration:none;
    }


    .premium-v2-feature:first-child{
      padding-left:0;
    }


    .premium-v2-feature:last-child{
      border-right:0;
    }


    .premium-v2-feature-icon{
      width:42px;
      height:42px;

      flex:none;

      display:grid;
      place-items:center;

      color:#329cff;
    }


    .premium-v2-feature-icon svg{
      display:block;
    }


    .premium-v2-feature > span:last-child{
      display:flex;
      flex-direction:column;

      min-width:0;
    }


    .premium-v2-feature b{
      color:#fff;

      font-size:15px;

      font-weight:780;

      line-height:1.3;
    }


    .premium-v2-feature small{
      display:block;

      margin-top:5px;

      color:#94afcc;

      font-size:12px;

      line-height:1.35;
    }


    .premium-v2-feature-link{
      transition:
        opacity .18s ease,
        transform .18s ease;
    }


    .premium-v2-feature-link:hover{
      opacity:.92;

      transform:
        translateY(-1px);
    }


    /* ======================================================
       MAIN HEADER
    ======================================================= */

    .premium-v2-header{
      padding:
        24px 0;

      background:
        rgba(4,18,33,.90);

      border-bottom:
        1px solid
        rgba(56,111,164,.27);

      backdrop-filter:
        blur(18px);
    }


    .premium-v2-header-grid{
      display:grid;

      grid-template-columns:
        285px
        minmax(420px,1fr)
        auto;

      align-items:center;

      gap:27px;
    }


    /* ======================================================
       BRAND
    ======================================================= */

    .premium-v2-brand{
      display:flex;
      align-items:center;

      gap:14px;

      min-width:max-content;

      color:#fff;

      text-decoration:none;
    }


    .premium-v2-brand img{
      width:76px;
      height:76px;

      display:block;

      object-fit:contain;

      background:transparent;

      border:0;

      padding:0;

      border-radius:15px;
    }


    .premium-v2-brand > span{
      display:flex;
      flex-direction:column;
    }


    .premium-v2-brand b{
      color:#fff;

      font-size:30px;

      font-weight:860;

      line-height:1;

      letter-spacing:-1px;
    }


    .premium-v2-brand small{
      margin-top:10px;

      color:#f2b92b;

      font-size:12px;

      line-height:1;

      font-weight:850;

      text-transform:none;

      letter-spacing:7px;
    }


    /* ======================================================
       SEARCH
    ======================================================= */

    .premium-v2-search{
      width:100%;

      max-width:720px;

      height:59px;

      justify-self:center;

      display:grid;

      grid-template-columns:
        49px
        minmax(0,1fr)
        auto;

      align-items:center;

      padding:5px;

      overflow:hidden;

      border:
        1px solid
        #285783;

      border-radius:17px;

      background:
        linear-gradient(
          180deg,
          #0b243f,
          #081a30
        );

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }


    .premium-v2-search:focus-within{
      border-color:#2997ff;

      box-shadow:
        0 0 0 4px
        rgba(22,140,255,.10);
    }


    .premium-v2-search-icon{
      display:grid;
      place-items:center;

      color:#75b8fb;
    }


    .premium-v2-search input{
      width:100%;

      height:100%;

      border:0;
      outline:0;

      padding:
        0 10px;

      background:transparent;

      color:#fff;

      font-size:15px;
    }


    .premium-v2-search input::placeholder{
      color:#7894b2;
    }


    .premium-v2-search button{
      height:47px;

      display:flex;
      align-items:center;
      justify-content:center;

      gap:9px;

      padding:
        0 22px;

      border:0;

      border-radius:12px;

      color:#fff;

      font-size:14px;

      font-weight:750;

      background:
        linear-gradient(
          135deg,
          #279dff,
          #0874f6
        );

      box-shadow:
        0 8px 23px
        rgba(0,119,255,.31);

      cursor:pointer;

      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }


    .premium-v2-search button:hover{
      transform:
        translateY(-1px);

      box-shadow:
        0 12px 30px
        rgba(0,119,255,.42);
    }


    /* ======================================================
       HEADER ACTIONS
    ======================================================= */

    .premium-v2-actions{
      display:flex;
      align-items:center;

      gap:19px;

      white-space:nowrap;
    }


    /* THEME */

    .premium-v2-theme{
      display:flex;
      align-items:center;

      gap:7px;

      color:#9db6d1;
    }


    .premium-v2-sun{
      color:#efbb35;
    }


    .premium-v2-switch{
      width:48px;
      height:27px;

      position:relative;

      flex:none;

      padding:3px;

      border:0;

      border-radius:999px;

      background:#26425f;

      cursor:pointer;

      transition:
        background .2s ease;
    }


    .premium-v2-switch i{
      width:21px;
      height:21px;

      display:block;

      border-radius:50%;

      background:#fff;

      box-shadow:
        0 2px 6px
        rgba(0,0,0,.25);

      transition:
        transform .2s ease;
    }


    .premium-v2-switch.on{
      background:#278fff;
    }


    .premium-v2-switch.on i{
      transform:
        translateX(21px);
    }


    /* PHONE */

    .premium-v2-phone{
      display:flex;
      align-items:center;

      gap:10px;

      color:#fff;

      text-decoration:none;
    }


    .premium-v2-phone-icon{
      width:38px;
      height:38px;

      display:grid;
      place-items:center;

      color:#2499ff;
    }


    .premium-v2-phone > span:last-child{
      display:flex;
      flex-direction:column;
    }


    .premium-v2-phone small{
      color:#8da7c2;

      font-size:10px;

      line-height:1.2;
    }


    .premium-v2-phone b{
      margin-top:4px;

      color:#fff;

      font-size:13px;

      font-weight:800;
    }


    /* HEADER LINKS */

    .premium-v2-links{
      display:flex;
      align-items:center;
    }


    .premium-v2-links button{
      padding:
        5px 13px;

      border:0;

      border-right:
        1px solid
        rgba(78,132,184,.30);

      background:transparent;

      color:#dce7f2;

      font-size:12px;

      cursor:pointer;

      transition:
        color .18s ease;
    }


    .premium-v2-links button:last-child{
      border-right:0;
    }


    .premium-v2-links button:hover{
      color:#339eff;
    }


    /* LANGUAGE */

    .premium-v2-language{
      min-height:46px;

      display:flex;
      align-items:center;

      gap:8px;

      padding:
        0 11px;

      border:
        1px solid
        #29577e;

      border-radius:12px;

      background:#081d33;
    }


    .premium-v2-language select{
      max-width:110px;

      border:0;

      outline:0;

      background:transparent;

      color:#fff;

      font-size:13px;

      cursor:pointer;
    }


    .premium-v2-language option{
      color:#102039;

      background:#fff;
    }


    /* ======================================================
       CATEGORY NAV
    ======================================================= */

    .premium-v2-catbar{
      background:
        rgba(4,17,31,.94);

      border-bottom:
        1px solid
        rgba(45,92,137,.22);
    }


    .premium-v2-categories{
      display:flex;
      align-items:center;

      gap:14px;

      padding-top:17px;
      padding-bottom:20px;

      overflow-x:auto;

      white-space:nowrap;

      scrollbar-width:none;
    }


    .premium-v2-categories::-webkit-scrollbar{
      display:none;
    }


    .premium-v2-pill{
      min-height:59px;

      flex:none;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      gap:13px;

      padding:
        0 28px;

      border:
        1px solid
        #24527c;

      border-radius:999px;

      color:#eef6ff;

      background:
        linear-gradient(
          180deg,
          rgba(10,34,58,.96),
          rgba(5,23,41,.96)
        );

      font-size:15px;

      font-weight:620;

      cursor:pointer;

      box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.025);

      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease,
        box-shadow .18s ease;
    }


    .premium-v2-pill svg{
      color:#3da3ff;
    }


    .premium-v2-pill:hover{
      transform:
        translateY(-2px);

      border-color:#348fdf;

      background:#0d2b4a;

      box-shadow:
        0 9px 25px
        rgba(0,0,0,.18);
    }


    .premium-v2-pill.active{
      color:#fff;

      border-color:#1488ff;

      background:
        linear-gradient(
          135deg,
          #269cff,
          #0875f6
        );

      box-shadow:
        0 11px 28px
        rgba(0,119,255,.32);
    }


    .premium-v2-pill.active svg{
      color:#fff;
    }


    .premium-v2-catalog b{
      margin-left:4px;

      font-size:26px;

      line-height:1;

      font-weight:400;
    }


    /* ======================================================
       HERO
    ======================================================= */

    .premium-v2-hero{
      min-height:605px;

      display:grid;

      grid-template-columns:
        43% 57%;

      position:relative;

      overflow:hidden;

      margin-top:0;

      border:
        1px solid
        #185b99;

      border-radius:28px;

      background:
        #07192c;

      box-shadow:
        0 24px 65px
        rgba(0,0,0,.21);
    }


    .premium-v2-hero-copy{
      position:relative;

      z-index:5;

      display:flex;
      flex-direction:column;
      justify-content:center;

      padding:
        56px 20px
        47px 36px;

      background:
        radial-gradient(
          circle at 80% 50%,
          rgba(22,102,170,.17),
          transparent 340px
        ),
        linear-gradient(
          90deg,
          #06182b 0%,
          #071b30 73%,
          rgba(7,27,48,.79)
          100%
        );
    }


    .premium-v2-hero-brand{
      display:flex;
      align-items:center;

      gap:19px;

      margin-bottom:24px;

      color:#f2c44f;

      font-size:13px;

      font-weight:820;

      letter-spacing:4px;
    }


    .premium-v2-hero-brand i{
      width:55px;
      height:2px;

      display:block;

      flex:none;

      background:#f2c44f;
    }


    .premium-v2-hero h1{
      max-width:650px;

      margin:0;

      color:#fff;

      font-size:
        clamp(
          50px,
          4.2vw,
          73px
        );

      line-height:1.01;

      font-weight:870;

      letter-spacing:-3px;
    }


    .premium-v2-hero h1 strong{
      color:#168cff;

      font-weight:870;
    }


    .premium-v2-count{
      display:flex;
      align-items:center;

      gap:20px;

      margin-top:24px;

      color:#fff;

      font-size:17px;
    }


    .premium-v2-count i{
      width:54px;
      height:2px;

      display:block;

      background:#f0c354;
    }


    .premium-v2-hero-copy > p{
      max-width:470px;

      margin:
        25px 0 0;

      color:#aec0d4;

      font-size:17px;

      line-height:1.72;
    }


    /* HERO BUTTONS */

    .premium-v2-hero-buttons{
      display:flex;
      align-items:center;

      gap:16px;

      margin-top:31px;
    }


    .premium-v2-primary,
    .premium-v2-secondary{
      min-height:64px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      gap:13px;

      border-radius:16px;

      font-size:15px;

      font-weight:760;

      cursor:pointer;

      transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }


    .premium-v2-primary{
      padding:
        0 27px;

      border:
        1px solid
        #2699ff;

      color:#fff;

      background:
        linear-gradient(
          135deg,
          #279cff,
          #0874f6
        );

      box-shadow:
        0 13px 31px
        rgba(0,119,255,.32);
    }


    .premium-v2-primary:hover{
      transform:
        translateY(-2px);

      box-shadow:
        0 17px 37px
        rgba(0,119,255,.43);
    }


    .premium-v2-primary b{
      margin-left:9px;

      font-size:24px;

      font-weight:400;
    }


    .premium-v2-secondary{
      padding:
        0 25px;

      border:
        1px solid
        #2d608f;

      color:#f4f8fc;

      background:
        rgba(7,27,48,.72);
    }


    .premium-v2-secondary svg{
      color:#45a6ff;
    }


    .premium-v2-secondary:hover{
      transform:
        translateY(-2px);

      background:#0d2c4c;
    }


    /* ======================================================
       HERO BENEFITS
    ======================================================= */

    .premium-v2-benefits{
      display:grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0,1fr)
        );

      gap:15px;

      margin-top:47px;
    }


    .premium-v2-benefits > div{
      display:flex;
      align-items:center;

      gap:11px;
    }


    .premium-v2-benefit-icon{
      width:46px;
      height:46px;

      flex:none;

      display:grid;
      place-items:center;

      color:#359eff;

      border:
        1px solid
        #245e91;

      border-radius:50%;

      background:
        rgba(10,44,75,.52);
    }


    .premium-v2-benefits > div > span:last-child{
      min-width:0;

      display:flex;
      flex-direction:column;
    }


    .premium-v2-benefits b{
      color:#fff;

      font-size:12px;

      line-height:1.25;

      font-weight:750;

      white-space:nowrap;
    }


    .premium-v2-benefits small{
      margin-top:4px;

      color:#819bb6;

      font-size:10px;

      line-height:1.3;

      white-space:nowrap;
    }


    /* ======================================================
       HERO VISUAL
    ======================================================= */

    .premium-v2-hero-visual{
      min-width:0;

      position:relative;

      overflow:hidden;

      background:
        linear-gradient(
          180deg,
          rgba(9,31,53,.08),
          rgba(2,14,26,.18)
        ),
        radial-gradient(
          circle at 55% 45%,
          #244967 0%,
          #112f4b 35%,
          #07192b 77%
        );
    }


    /* wooden wall */

    .premium-v2-wood{
      position:absolute;

      top:0;
      right:21%;

      width:15%;
      height:73%;

      opacity:.88;

      background:
        repeating-linear-gradient(
          90deg,
          #412a1f 0px,
          #412a1f 7px,
          #191615 7px,
          #191615 13px
        );

      border-left:
        1px solid
        rgba(255,255,255,.05);

      border-right:
        1px solid
        rgba(255,255,255,.05);
    }


    /* shelf */

    .premium-v2-shelf{
      position:absolute;

      top:31%;
      left:14%;

      width:43%;
      height:7px;

      z-index:1;

      border-radius:10px;

      background:
        linear-gradient(
          90deg,
          #795230,
          #c28a46
        );

      box-shadow:
        0 8px 18px
        rgba(255,180,77,.26);
    }


    .premium-v2-shelf::after{
      content:"";

      position:absolute;

      left:3%;
      right:3%;
      top:7px;

      height:5px;

      background:
        rgba(255,182,73,.47);

      filter:
        blur(6px);
    }


    /* plant */

    .premium-v2-plant{
      position:absolute;

      left:22%;
      top:13%;

      width:100px;
      height:165px;

      z-index:2;
    }


    .premium-v2-plant::before,
    .premium-v2-plant::after{
      content:"";

      position:absolute;

      left:50%;
      bottom:43px;

      width:12px;
      height:93px;

      border-radius:
        100% 0
        100% 0;

      background:
        linear-gradient(
          135deg,
          #4f843c,
          #183e23
        );

      transform-origin:
        bottom center;
    }


    .premium-v2-plant::before{
      transform:
        rotate(-42deg);
    }


    .premium-v2-plant::after{
      transform:
        rotate(38deg)
        scale(.9);
    }


    .premium-v2-plant i{
      position:absolute;

      left:30px;
      bottom:0;

      width:55px;
      height:52px;

      display:block;

      border-radius:
        5px 5px
        16px 16px;

      background:
        linear-gradient(
          180deg,
          #d8d1c5,
          #8e8b85
        );
    }


    /* poster */

    .premium-v2-poster{
      position:absolute;

      z-index:2;

      right:5.5%;
      top:6%;

      width:142px;
      height:205px;

      display:flex;
      align-items:center;
      justify-content:center;

      padding:17px;

      color:#8ea2b9;

      border:
        8px solid
        #111820;

      outline:
        1px solid
        #334355;

      background:#15253a;

      font-family:
        Georgia,
        serif;

      font-size:24px;

      line-height:1.05;

      text-align:center;

      box-shadow:
        0 10px 25px
        rgba(0,0,0,.28);
    }


    /* platform */

    .premium-v2-platform{
      position:absolute;

      left:0;
      right:0;
      bottom:0;

      height:26%;

      z-index:1;

      background:
        linear-gradient(
          180deg,
          #28425b 0%,
          #142a3e 60%,
          #0b1a2a 100%
        );

      border-top:
        1px solid
        rgba(255,255,255,.09);

      box-shadow:
        inset 0 15px 30px
        rgba(255,255,255,.025);
    }


    .premium-v2-platform::before{
      content:"";

      position:absolute;

      left:0;
      right:0;
      top:-3px;

      height:2px;

      background:
        rgba(150,203,247,.12);
    }


    /* product images */

    .premium-v2-product{
      position:absolute;

      z-index:4;

      object-fit:contain;

      filter:
        drop-shadow(
          0 18px 22px
          rgba(0,0,0,.35)
        );
    }


    .premium-v2-product-vacuum{
      left:23%;
      bottom:10%;

      width:40%;
      height:62%;
    }


    .premium-v2-product-iron{
      right:21%;
      bottom:11%;

      width:21%;
      height:35%;
    }


    .premium-v2-product-hair{
      right:3%;
      bottom:19%;

      width:20%;
      height:27%;
    }


    .premium-v2-product-kettle{
      left:5%;
      bottom:14%;

      width:20%;
      height:31%;

    /* =====================================================
       ACTIVATE PREMIUM DESIGN
    ===================================================== */

    function enhance(){

      /*
       * ADMIN PANELNI TEGMAYMIZ
       */

      if(
        location.pathname ===
        '/admin'
      ){
        return;
      }


      /*
       * OLD PREMIUM ALREADY EXISTS
       */

      if(
        app.querySelector(
          '.premium-v2-shell'
        )
      ){
        return;
      }


      const header =
        createHeader();


      if(!header){
        return;
      }


      /*
       * Insert premium header
       */

      header.oldTopbar.before(
        header.shell
      );


      /*
       * Hide old header
       */

      header.oldTopbar
        .classList
        .add(
          'premium-v2-legacy'
        );


      header.oldHeader
        .classList
        .add(
          'premium-v2-legacy'
        );


      header.oldCategories
        .classList
        .add(
          'premium-v2-legacy'
        );


      /*
       * Premium hero
       */

      const hero =
        createHero();


      if(hero){

        hero.oldHero.before(
          hero.section
        );


        hero.oldHero
          .classList
          .add(
            'premium-v2-legacy'
          );


        hero.oldService
          ?.classList
          .add(
            'premium-v2-legacy'
          );

      }

    }


    /* =====================================================
       WATCH app.js RENDER
    ===================================================== */

    let scheduled =
      false;


    function scheduleEnhance(){

      if(scheduled){
        return;
      }


      scheduled =
        true;


      requestAnimationFrame(
        () => {

          scheduled =
            false;

          enhance();

        }
      );

    }


    const observer =
      new MutationObserver(
        scheduleEnhance
      );


    observer.observe(
      app,
      {
        childList:true,
        subtree:true
      }
    );


    window.addEventListener(
      'popstate',
      scheduleEnhance
    );


    window.addEventListener(
      'hashchange',
      scheduleEnhance
    );


    /*
     * Initial activation
     */

    scheduleEnhance();

  </script>
